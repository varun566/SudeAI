apiVersion: batch/v1
kind: Job
metadata:
  name: telemetry-migrate
  namespace: telemetry
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: network-telemetry-api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: telemetry-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
